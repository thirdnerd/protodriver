name: packages

# Building every target is a release activity, not a per-commit one: the
# five-runner matrix runs when requested or when a release tag is pushed.
# Local builders use the same tools/build-package.mjs entry point and do not
# depend on Actions.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  package:
    name: ${{ matrix.target }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: darwin-arm64
            runner: macos-15
          - target: darwin-x64
            runner: macos-15-intel
          - target: win32-x64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    steps:
      # Keep committed bytes unchanged on Windows as well as POSIX hosts.
      - name: Configure checkout line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
      - name: Install Linux package prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap busybox-static libudev-dev
      - name: Verify Linux isolated smoke can run
        id: linux_sandbox
        if: runner.os == 'Linux'
        run: node tools/prepare-linux-sandbox.mjs
      - name: Build and smoke dispatch package
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: node tools/build-package.mjs --target "$PACKAGE_TARGET" --output package-output
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
      # A tag is a legal Git ref, not trusted shell source. Pass it through the
      # environment so the script cannot interpret its bytes before validation.
      - name: Build and smoke release package
        if: github.event_name == 'push'
        shell: bash
        run: node tools/build-package.mjs --target "$PACKAGE_TARGET" --output package-output --release-tag "$RELEASE_TAG"
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
          RELEASE_TAG: ${{ github.ref_name }}
      - name: Restore Linux AppArmor restriction
        if: always() && runner.os == 'Linux' && steps.linux_sandbox.outputs.restore_apparmor == 'true'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=1
      - uses: actions/attest-build-provenance@v4
        if: github.event_name == 'push'
        with:
          subject-path: package-output/protodriver-*
      - uses: actions/upload-artifact@v4
        with:
          name: protodriver-${{ matrix.target }}
          path: package-output/protodriver-*
          if-no-files-found: error

  # The hosted page is published by the same tag that builds the archives, so
  # that shipping is one act. Publishing it separately is how it went three days
  # and one release stale while serving a defect that was already fixed on main.
  #
  # The catalog location is this deployment's fact, not the product's: the page
  # lives under /protodriver/ and the packages under /pdpackages/, published from
  # a different repository onto the same origin. Nothing in apps/web/src names it.
  pages:
    name: hosted page
    if: github.event_name == 'push'
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
      - name: Install workspaces the browser build needs
        run: node tools/install-package-build-dependencies.mjs
      - name: Build the browser host
        run: node apps/web/build.mjs --catalog ../pdpackages/catalog.json --output web-dist
      # Refuses a source map, a source leak, or any file outside its closed set.
      - name: Stage the publishable files
        run: node tools/stage-pages.mjs web-dist pages
      - name: Publish to gh-pages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -eu
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}"
          git clone --quiet --branch gh-pages --depth 1 "$remote" published
          # The build owns only its own files. Anything else on the branch is
          # another owner's and is left exactly as found.
          # -A so the leading-dot .nojekyll is carried; plain ls would drop it.
          for name in $(ls -A pages); do
            rm -rf "published/$name"
            cp -R "pages/$name" "published/$name"
          done
          cd published
          git config user.name "thirdnerd"
          git config user.email "280008708+thirdnerd@users.noreply.github.com"
          # Stage first: an untracked new file is invisible to git diff.
          git add -A
          if git diff --cached --quiet; then
            echo "published page already matches this build"
            exit 0
          fi
          git commit --quiet -m "Publish the browser host built at ${GITHUB_SHA} for ${RELEASE_TAG}"
          git push --quiet origin gh-pages

  release:
    if: github.event_name == 'push'
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
      - uses: actions/download-artifact@v4
        with:
          pattern: protodriver-*
          path: release-assets
          merge-multiple: true
      # Keep the tag out of script text here especially: this step has a token
      # with contents: write. Quoted env expansion passes one literal argument.
      - name: Check assets and create draft release
        shell: bash
        run: node tools/release-assets.mjs --tag "$RELEASE_TAG" --directory release-assets --publish-draft
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}

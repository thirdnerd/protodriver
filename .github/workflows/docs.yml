name: docs

# RELEASE TAGS OR MANUAL DISPATCH ONLY. No branch `push`, `pull_request`, or
# `schedule` trigger.
#
# The Linux verdict runs locally, faster, with the commands below. The Windows
# suites require a Windows host: they exist here because platform-specific path
# and executable behavior cannot be reproduced on a Linux development machine.
#
# Run from the Actions tab, or:
#
#     gh workflow run docs.yml
#
# Locally, which is faster and free:
#
#     node tools/install-package-build-dependencies.mjs
#     bash tools/run-tests.sh
#
# Release tags run both host verdicts. Both jobs can also be requested manually
# for a clean-machine result.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  windows-suites:
    name: suites on Windows
    runs-on: windows-2025
    steps:
      # Committed bytes must reach the runner unchanged; a rewritten line
      # ending is its own failure and would be read as a test defect.
      - name: Configure checkout line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
      - name: Install every workspace
        run: node tools/install-package-build-dependencies.mjs
      # Deliberately not tools/run-tests.sh: that script's verdict depends on
      # GNU timeout, which a Windows runner has no equivalent of, and on a
      # clean extraction that a fresh checkout already provides. This answers
      # the narrower question the Linux verdict cannot - whether the suites
      # pass on Windows - and does not try to mean the same thing.
      - name: Run every discovered suite
        shell: bash
        run: |
          fail=0
          ran=0
          for root in apps/* packages/* tools; do
            [ -d "$root/test" ] || continue
            echo "== $root"
            # run-tests-environment.test.mjs execFiles tools/run-tests.sh, and a
            # POSIX shell script is not an executable image on Windows: the spawn
            # fails EFTYPE before the assertion it was written for. What it checks
            # is the Linux verdict machinery, which does not run here either.
            files=$(ls "$root"/test/*.test.mjs | grep -v 'run-tests-environment.test.mjs' || true)
            [ -n "$files" ] || continue
            # shellcheck disable=SC2086
            ( cd "$root" && node --test $(echo "$files" | sed "s|^$root/||") ) || fail=1
            ran=$((ran + 1))
          done
          echo "suites run: $ran"
          [ "$ran" -gt 0 ] || { echo "no suite ran; discovery is broken"; exit 2; }
          exit $fail

  linux-suites:
    name: suites on Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
      - name: Install every workspace
        run: node tools/install-package-build-dependencies.mjs
      - name: Test the committed ref from a clean extraction
        run: bash tools/run-tests.sh "$GITHUB_SHA"

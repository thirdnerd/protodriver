name: docs

# MANUAL ONLY. No `push`, no `pull_request`, no `schedule`.
#
# Every check here runs locally, faster, with the commands below. Running them
# on a hosted runner is a convenience for someone who wants a clean-machine
# result, not the place the checks are expected to happen.
#
# Run from the Actions tab, or:
#
#     gh workflow run docs.yml
#
# Locally, which is faster and free:
#
#     cd packages/contracts && npm ci && npx --no-install tsc --noEmit
#     cd packages/contracts && node --test test/clone.test.mjs
#     cd packages/core && npm ci && npm run verify
#     cd packages/transport-mock && npm ci && npm run verify
#     cd packages/transport-node-serial && npm ci && npm run verify
#     cd apps/cli && npm ci && npm run verify
#
# A release tag reinstated part of that: the suites now run on Windows, where
# the compiler is not the loop because the breakage is platform-specific. Two
# defects reached v0.1.0 that nobody could have noticed locally on Linux - a
# test runner recorded without its executable bit, and twelve test paths built
# from a file URL that only misbehaves on Windows. Everything else stays manual.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  windows-suites:
    name: suites on Windows
    runs-on: windows-2025
    steps:
      # Committed bytes must reach the runner unchanged; a rewritten line
      # ending is its own failure and would be read as a test defect.
      - name: Configure checkout line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
      - name: Install every workspace
        run: node tools/install-package-build-dependencies.mjs
      # Deliberately not tools/run-tests.sh: that script's verdict depends on
      # GNU timeout, which a Windows runner has no equivalent of, and on a
      # clean extraction that a fresh checkout already provides. This answers
      # the narrower question the Linux verdict cannot - whether the suites
      # pass on Windows - and does not try to mean the same thing.
      - name: Run every discovered suite
        shell: bash
        run: |
          fail=0
          ran=0
          for root in apps/* packages/* tools; do
            [ -d "$root/test" ] || continue
            echo "== $root"
            # run-tests-environment.test.mjs execFiles tools/run-tests.sh, and a
            # POSIX shell script is not an executable image on Windows: the spawn
            # fails EFTYPE before the assertion it was written for. What it checks
            # is the Linux verdict machinery, which does not run here either.
            files=$(ls "$root"/test/*.test.mjs | grep -v 'run-tests-environment.test.mjs' || true)
            [ -n "$files" ] || continue
            # shellcheck disable=SC2086
            ( cd "$root" && node --test $(echo "$files" | sed "s|^$root/||") ) || fail=1
            ran=$((ran + 1))
          done
          echo "suites run: $ran"
          [ "$ran" -gt 0 ] || { echo "no suite ran; discovery is broken"; exit 2; }
          exit $fail

  contracts:
    name: contracts compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        working-directory: packages/contracts
      # Carries the wire-guard assertions: the wire types are clone-safe and
      # the live objects are not. Both are checked here, at no extra cost.
      - run: npx --no-install tsc --noEmit
        working-directory: packages/contracts
      - run: node --test test/clone.test.mjs
        working-directory: packages/contracts

  core:
    name: core runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        working-directory: packages/core
      - run: npm run verify
        working-directory: packages/core

  transport-mock:
    name: mock connection replacement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        working-directory: packages/transport-mock
      - run: npm run verify
        working-directory: packages/transport-mock

  transport-node-serial:
    name: Node serial transport
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        working-directory: packages/transport-node-serial
      - run: npm run verify
        working-directory: packages/transport-node-serial

  cli:
    name: node capture destination
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        working-directory: apps/cli
      - run: npm run verify
        working-directory: apps/cli
